name: Release

# Tags make releases; nothing is published from a branch. `docker-compose.yml`
# points at :latest, so pushing one is what turns "clone and build the frontend
# for ten minutes" back into "up -d, forty seconds".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 is emulated here rather than built on an arm runner: Apple
      # Silicon and ARM mini-servers are a common host for something like this,
      # and a slow build at a tag costs less than a missing architecture.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` follows tags, not the default branch: a compose file
          # pointing at :latest must never resolve to whatever landed on main
          # ten minutes ago. A manual run publishes a sha tag and nothing else.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,enable=${{ github.ref_type != 'tag' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
