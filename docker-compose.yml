name: tany

services:
  api:
    image: ghcr.io/swrneko/tany:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8927}:8927"
    env_file:
      - path: .env
        required: false
    volumes:
      - data:/data

  worker:
    image: ghcr.io/swrneko/tany:latest
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
    volumes:
      - data:/data
    # The image's healthcheck curls the API port, which the worker does not
    # serve. A real liveness probe belongs on the heartbeat column and arrives
    # with job recovery; until then, an inherited check that can only ever fail
    # is worse than none.
    healthcheck:
      disable: true
    # Waits for the API, which owns the migrations. The worker never touches
    # the schema itself -- two processes racing alembic is a bad first minute.
    depends_on:
      api:
        condition: service_healthy

  # Off unless asked for: docker compose --profile diarize up -d
  #
  # Not a published image -- torch and the weights are gigabytes that most
  # installations never need, and the model is gated behind a Hugging Face
  # account, so the first build is something you opt into knowingly. Set
  # HF_TOKEN in .env and accept the terms of pyannote/speaker-diarization-3.1
  # once with the same account, or the download answers 403.
  diarizer:
    profiles: ["diarize"]
    build: ./diarizer
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  data:
  models:
